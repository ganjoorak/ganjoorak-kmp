name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      actions: write

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p assets
          find dist -type f \( -name '*.apk' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' \) -print -exec cp -t assets {} +
          ls -la assets
          test -n "$(find assets -name '*.apk')"
          test -n "$(find assets -name '*.deb')"
          test -n "$(find assets -name '*.AppImage')"
          test -n "$(find assets -name '*.msi')"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/*
